name: Verify pricing calculator

on:
  push:
    branches:
      - refactor/professional-positioning-2026
    paths:
      - .github/workflows/verify-calculator.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test calculator
        shell: bash
        run: |
          mkdir -p calculator-artifacts
          npm run start > calculator-artifacts/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8001/cenik > /dev/null; then break; fi
            sleep 1
          done
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          (async () => {
            const viewports = [
              { name: 'desktop', width: 1440, height: 900 },
              { name: 'mobile-360', width: 360, height: 800 },
              { name: 'mobile-390', width: 390, height: 844 },
              { name: 'mobile-412', width: 412, height: 915 },
            ];
            const browser = await chromium.launch({ headless: true });
            const report = [];

            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport: { width: viewport.width, height: viewport.height } });
              const page = await context.newPage();
              const consoleErrors = [];
              const pageErrors = [];
              page.on('console', message => { if (message.type() === 'error') consoleErrors.push(message.text()); });
              page.on('pageerror', error => pageErrors.push(error.message));

              const response = await page.goto('http://127.0.0.1:8001/cenik', { waitUntil: 'networkidle' });
              const initial = await page.evaluate(() => ({
                h1Count: document.querySelectorAll('h1').length,
                overflow: document.documentElement.scrollWidth > document.documentElement.clientWidth + 1,
                width: document.documentElement.clientWidth,
                scrollWidth: document.documentElement.scrollWidth,
              }));

              await page.getByRole('radio', { name: /E-shop/ }).check();
              await page.getByRole('checkbox', { name: /Integrace platební brány/ }).check();
              await page.getByRole('checkbox', { name: /Měsíční správa webu/ }).check();

              const summary = page.getByRole('complementary', { name: 'Souhrn kalkulace' });
              const summaryText = await summary.innerText();
              if (!summaryText.includes('48 000') && !summaryText.includes('48 000')) throw new Error(`Missing one-time 48 000 total in ${viewport.name}: ${summaryText}`);
              if (!summaryText.includes('2 400') && !summaryText.includes('2 400')) throw new Error(`Missing monthly 2 400 total in ${viewport.name}: ${summaryText}`);

              await page.getByRole('button', { name: 'Vymazat výběr' }).click();
              if (!(await summary.innerText()).includes('Zatím není nic vybráno.')) throw new Error(`Reset failed in ${viewport.name}`);

              await page.getByRole('checkbox', { name: /Revize a debloat AI webu/ }).check();
              const aiText = await summary.innerText();
              if (!aiText.includes('15 000') && !aiText.includes('15 000')) throw new Error(`Missing AI debloat price in ${viewport.name}: ${aiText}`);

              await page.screenshot({ path: `calculator-artifacts/cenik-${viewport.name}.png`, fullPage: true });

              report.push({ viewport, status: response?.status() ?? null, initial, consoleErrors, pageErrors });
              await context.close();
            }

            const legacy = await browser.newPage({ viewport: { width: 390, height: 844 } });
            const legacyResponse = await legacy.goto('http://127.0.0.1:8001/kalkulacka/web', { waitUntil: 'networkidle' });
            const legacyOverflow = await legacy.evaluate(() => document.documentElement.scrollWidth > document.documentElement.clientWidth + 1);
            report.push({ route: '/kalkulacka/web', status: legacyResponse?.status() ?? null, overflow: legacyOverflow });
            await legacy.close();

            await browser.close();
            fs.writeFileSync('calculator-artifacts/report.json', JSON.stringify(report, null, 2));

            const failures = report.filter(item => item.status !== 200 || item.initial?.h1Count !== undefined && item.initial.h1Count !== 1 || item.initial?.overflow || item.overflow || item.consoleErrors?.length || item.pageErrors?.length);
            console.log(JSON.stringify({ checked: report.length, failures }, null, 2));
            if (failures.length) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-verification
          path: calculator-artifacts/
          if-no-files-found: error
